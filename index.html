<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>His Theatre</title>
    <meta name="description" content="Dues, receipts and ministry finances for HIS (Hearts In Service) Theatre Ministry." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#343434" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="His Theatre" />
    <script>
      // Apply the saved light/dark, text size and font choices before the first paint so the page never flashes.
      try {
        var t = localStorage.getItem("his-theatre.appearance");
        var old = localStorage.getItem("his-theatre.theme");
        if (!t && old) t = old === "light" ? "day" : old === "dark" ? "night" : null;
        if (["day", "night", "dark", "clear", "blur", "frosted"].indexOf(t) >= 0) document.documentElement.dataset.theme = t;
        if (localStorage.getItem("his-theatre.eye-care") === "on") document.documentElement.dataset.eyeCare = "";
        var s = localStorage.getItem("his-theatre.text-size");
        if (["smaller", "small", "large", "larger"].indexOf(s) >= 0) document.documentElement.dataset.textSize = s;
        var f = localStorage.getItem("his-theatre.font") || "apple";
        var fonts = {
          apple: "Inter:wght@400;500;600;700",
          nunito: "Nunito:wght@400;600;700;800",
          poppins: "Poppins:wght@400;500;600;700",
          lato: "Lato:wght@400;700;900",
          lora: "Lora:wght@400;600;700",
          atkinson: "Atkinson+Hyperlegible:wght@400;700"
        };
        if (fonts[f]) {
          document.documentElement.dataset.font = f;
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.id = "his-font";
          l.href = "https://fonts.googleapis.com/css2?family=" + fonts[f] + "&display=swap";
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
