<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>His Theatre</title>
    <meta name="description" content="Dues, receipts and ministry finances for HIS (Hearts In Service) Theatre Ministry." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#343434" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="His Theatre" />
    <script>
      // Apply the saved light/dark and text size choices before the first paint so the page never flashes.
      try {
        var t = localStorage.getItem("his-theatre.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var s = localStorage.getItem("his-theatre.text-size");
        if (s === "large" || s === "larger") document.documentElement.dataset.textSize = s;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
